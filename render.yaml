services:
  - type: web
    name: mrbeast-community
    runtime: node
    plan: free
    buildCommand: npm ci --prefix frontend && npm ci --prefix backend && npm run build --prefix frontend
    startCommand: npm start --prefix backend
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mrbeast-community-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: mrbeast-community-db
    databaseName: mrbeast_community
    user: mrbeast_community
    plan: free